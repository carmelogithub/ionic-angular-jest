<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>edit-product-modal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">edit-product-modal</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label position="stacked">
      Nombre
    </ion-label>
    <ion-input [(ngModel)]="producto.nombre" name="nombre">
    </ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">
      Precio
    </ion-label>
    <ion-input type="number" [(ngModel)]="producto.precio" name="precio">
    </ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">
      Unidades
    </ion-label>
    <ion-input type="number" [(ngModel)]="producto.unidades" name="unidades">
    </ion-input>
  </ion-item>
  <ion-item>
    <ion-label position="stacked">
      URL Imagen
    </ion-label>
    <ion-input [(ngModel)]="producto.imagen" name="imagen">
    </ion-input>
  </ion-item>
  <ion-button expand="block" color="success" (click)="guardar()">
    Guardar
  </ion-button>




</ion-content>
