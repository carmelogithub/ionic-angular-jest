<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">productos</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-refresher
slot="fixed"
(ionRefresh)="refrescar($event)"
>
<ion-refresher-content>
</ion-refresher-content>
</ion-refresher>


  <ion-card *ngFor="let producto of productos">
    <img [src]="producto.imagen" alt="producto">
    <ion-card-header>
      <ion-card-title>
        {{producto.nombre}}
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="none">
        <ion-label>
          Stock:
          {{producto.unidades}}
        </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-label>
          Precio:
          {{producto.precio}} €
        </ion-label>
      </ion-item>
      <ion-button expand="block" color="primary" (click)="editarProducto(producto)">
        Ver detalle
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
